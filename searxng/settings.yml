# SearXNG settings for Sinout private instance
# use_default_settings inherits all built-in engines + overrides below
use_default_settings: true

general:
  instance_name: "Sinout Search"
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false

server:
  # Secret key — overridden by SEARXNG_SECRET env var at runtime
  secret_key: "change_me_via_SEARXNG_SECRET_env"
  limiter: false          # no rate-limiting in our private instance
  image_proxy: false
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
  default_locale: "ru"
  query_in_title: false
  infinite_scroll: false
  default_theme: simple

# Бюджет времени на исходящие запросы. Не был задан вовсе, и SearXNG брал
# своё умолчание — слишком тесное: медленный, но живой источник не успевал
# ответить, и поиск возвращал пустоту.
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ru-RU"
  # IMPORTANT: json format must be enabled for the API to work
  formats:
    - html
    - json

# Override specific engines — disable ones that need API keys or are unreliable
# Проверено замером 05.10.2026 на ДОМАШНЕМ адресе, не серверном: из крупных
# движков через SearXNG отвечает только Яндекс. Это важно: раньше мы считали
# виноватым дата-центровый адрес сервера, но Google и Brave одинаково молчат и
# с обычного домашнего. Дело не в адресе — большие поисковики просто закрылись
# от чужих обёрток.
engines:
  # Отдаёт 10 результатов по делу и со снипетами там, где все остальные дают 0.
  - name: yandex
    engine: yandex
    shortcut: yx
    disabled: false

  # Чешский, со своим индексом. По русским запросам слабее Яндекса, но отвечает
  # всегда — а второй живой источник лучше одного живого.
  - name: seznam
    engine: seznam
    shortcut: szn
    disabled: false
    # По русским запросам подмешивает постороннее («купить фидер» → реферат на
    # academia.edu), поэтому в общем списке идёт ПОСЛЕ Яндекса. Нужен не ради
    # качества, а чтобы выдача не обнулилась, когда закроется и Яндекс.
    weight: 0.3

  # Возвращает ПУСТО и молча: ни ошибки, ни результатов — страница с проверкой
  # вместо выдачи. Включённым он только тратил общий бюджет времени.
  - name: google
    engine: google
    shortcut: g
    disabled: true

  # Отвечает, но не на заданный вопрос: на «статую зубра» присылал справку
  # Windows и форум про гидроциклы. Bing подсовывает серверным адресам
  # заглушку, и парсер честно её разбирает. Мусор хуже пустоты — агент станет
  # его пересказывать.
  - name: bing
    engine: bing
    shortcut: b
    disabled: true

  # DuckDuckGo в замерах не ответил ни разу: его движок делает лишний обмен
  # токенами и залипает, а веб-выдачу он всё равно во многом повторяет за Bing.
  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: true

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    language: ru

  - name: google news
    engine: google_news
    shortcut: gn
    disabled: false
    categories: news

  - name: hackernews
    engine: hackernews
    shortcut: hn
    disabled: false
    categories: news, it

  - name: github
    engine: github
    shortcut: gh
    disabled: false
    categories: it

  # Disable engines that require API keys or are often blocked
  - name: wolframalpha
    disabled: true
  # Был единственным рабочим в прошлом замере — и перестал: теперь отвечает
  # «слишком много запросов» на первый же вызов, с любого адреса. Собственный
  # индекс у него остался, но бесплатный доступ к нему через обёртку закрыли:
  # Brave продаёт его через API по ключу (см. SEARCH_API=brave).
  - name: brave
    engine: brave
    shortcut: br
    disabled: true

  # Тоже молча пустой. И он, и Google когда-то работали — это не наша поломка,
  # а закрывающаяся дверь: каждый такой движок рано или поздно отваливается.
  # Поэтому надёжный путь — ключ поставщика, а эта россыпь бесплатна и не более.
  - name: mojeek
    disabled: true

  # Не движок выдачи, а справочник, но при старте падает с 403 и пишет ошибку
  # в каждый лог. Пользы от него у нас нет — Википедия отвечает за то же.
  - name: wikidata
    disabled: true

  # Эти в замере не ответили ни разу и тянули на себя общий бюджет времени:
  # с ними тот же запрос давал 0 результатов, без них — 10. Отключены не
  # потому что «лишние», а потому что глушили рабочие.
  - name: aol
    disabled: true
  - name: startpage
    disabled: true
  - name: karmasearch
    disabled: true
  - name: karmasearch videos
    disabled: true
  - name: qwant
    disabled: true
