# SearXNG settings for Sinout private instance
# use_default_settings inherits all built-in engines + overrides below
use_default_settings: true

general:
  instance_name: "Sinout Search"
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false

server:
  # Secret key — overridden by SEARXNG_SECRET env var at runtime
  secret_key: "change_me_via_SEARXNG_SECRET_env"
  limiter: false          # no rate-limiting in our private instance
  image_proxy: false
  port: 8080
  bind_address: "0.0.0.0"

ui:
  static_use_hash: true
  default_locale: "ru"
  query_in_title: false
  infinite_scroll: false
  default_theme: simple

# Бюджет времени на исходящие запросы. Не был задан вовсе, и SearXNG брал
# своё умолчание — слишком тесное: медленный, но живой источник не успевал
# ответить, и поиск возвращал пустоту.
outgoing:
  request_timeout: 6.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20

search:
  safe_search: 0
  autocomplete: ""
  default_lang: "ru-RU"
  # IMPORTANT: json format must be enabled for the API to work
  formats:
    - html
    - json

# Override specific engines — disable ones that need API keys or are unreliable
engines:
  - name: google
    engine: google
    shortcut: g
    disabled: false
    use_mobile_ui: false

  # Отвечает, но не на заданный вопрос: на «статую зубра» присылал справку
  # Windows и форум про гидроциклы. Bing подсовывает серверным адресам
  # заглушку, и парсер честно её разбирает. Мусор хуже пустоты — агент станет
  # его пересказывать.
  - name: bing
    engine: bing
    shortcut: b
    disabled: true

  # DuckDuckGo в замерах не ответил ни разу: его движок делает лишний обмен
  # токенами и залипает, а веб-выдачу он всё равно во многом повторяет за Bing.
  - name: duckduckgo
    engine: duckduckgo
    shortcut: d
    disabled: true

  - name: wikipedia
    engine: wikipedia
    shortcut: wp
    disabled: false
    language: ru

  - name: google news
    engine: google_news
    shortcut: gn
    disabled: false
    categories: news

  - name: hackernews
    engine: hackernews
    shortcut: hn
    disabled: false
    categories: news, it

  - name: github
    engine: github
    shortcut: gh
    disabled: false
    categories: it

  # Disable engines that require API keys or are often blocked
  - name: wolframalpha
    disabled: true
  # Замер на боевом сервере: единственный движок, который отвечает ПО ДЕЛУ.
  # Пометка «часто блокируется» оказалась неверной — держит собственный индекс
  # и серверные адреса не режет, в отличие от Google и Bing.
  - name: brave
    engine: brave
    shortcut: br
    disabled: false

  # Эти в замере не ответили ни разу и тянули на себя общий бюджет времени:
  # с ними тот же запрос давал 0 результатов, без них — 10. Отключены не
  # потому что «лишние», а потому что глушили рабочие.
  - name: aol
    disabled: true
  - name: startpage
    disabled: true
  - name: karmasearch
    disabled: true
  - name: karmasearch videos
    disabled: true
  - name: qwant
    disabled: true
