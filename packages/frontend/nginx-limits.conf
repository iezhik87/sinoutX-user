# Loaded (via conf.d/00-limits.conf, before default.conf) into the SAME http{}
# scope the stock nginx:alpine image wraps conf.d/*.conf in. limit_req_zone must
# live at http{} level, but nginx.conf here only defines a server{} block — so
# this sits in its own file, named to sort first alphabetically.
limit_req_zone $binary_remote_addr zone=search:10m rate=20r/s;
