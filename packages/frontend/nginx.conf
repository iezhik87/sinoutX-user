resolver 127.0.0.11 valid=10s ipv6=off;

server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # SSE / AI streaming endpoint — buffering must be off
  location ^~ /api/v1/ai/ {
    set $backend backend:3010;
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_connect_timeout 60s;
    keepalive_timeout 3600s;
    chunked_transfer_encoding on;
  }

  # Proxy all other API requests to backend
  location ^~ /api/ {
    set $backend backend:3010;
    proxy_pass http://$backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_read_timeout 120s;
    client_max_body_size 100m;
  }

  # MinIO public files — proxy so browser can access uploaded images/files
  location ~ ^/uploads/(.*)$ {
    set $minio minio:9000;
    set $key $1;
    proxy_pass http://$minio/sinout-files/$key;
    proxy_set_header Host minio:9000;
    proxy_http_version 1.1;
    expires 7d;
    add_header Cache-Control "public";
  }

  # SearXNG — proxy all its known paths with the full original URI intact
  location ~ ^/(search|static|autocompleter|preferences|stats|about|image_proxy|info|favicon\.svg)(/|$|\?) {
    proxy_pass http://searxng:8080;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_http_version 1.1;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
  }
  # catch-all for /static/* with no trailing content
  location ~* ^/static/ {
    proxy_pass http://searxng:8080;
    proxy_set_header Host $host;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header Content-Security-Policy;
  }

  # Service worker — never cache, so browsers fetch the latest /sw.js and pick up
  # the kill-switch that unregisters the old cache-first worker. Must precede the
  # generic *.js immutable rule below (exact match wins over regex).
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
    try_files $uri =404;
  }

  # index.html — never cache so browser always gets the latest bundle references
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  # SPA fallback — serve index.html for all methods (POST/PUT/PATCH/DELETE from browser nav)
  # The HTML must never be cached (so a redeploy's new bundle refs are picked up);
  # hashed /assets/* are cached forever by the regex location below.
  location / {
    try_files $uri $uri/ /index.html;
    error_page 405 = @spa_fallback;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    add_header Pragma "no-cache";
    add_header Expires "0";
  }

  location @spa_fallback {
    return 200;
    add_header Content-Type text/html;
  }

  # Cache assets
  location ~* \.(js|css|png|svg|ico|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  gzip on;
  gzip_types text/css application/javascript image/svg+xml;
}
