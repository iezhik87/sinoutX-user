services:
  # ═══ Database ═══
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    volumes:
      # A named volume by default - works out of the box. To keep the data on
      # another disk, set POSTGRES_DATA_DIR=/abs/path in .env (see .env.example).
      - ${POSTGRES_DATA_DIR:-postgres_data}:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: sinout
      POSTGRES_USER: ${DB_USER:-sinout}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    # not published to the host - reachable only inside the Docker network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-sinout}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ═══ Cache and pub/sub ═══
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "if [ -n \"$$REDIS_PASSWORD\" ]; then redis-server --requirepass $$REDIS_PASSWORD; else redis-server; fi"
    volumes:
      - redis_data:/data
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ${REDIS_PASSWORD:+-a $REDIS_PASSWORD} ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ═══ Full-text search ═══
  meilisearch:
    image: getmeili/meilisearch:v1.10
    restart: unless-stopped
    volumes:
      - ${MEILI_DATA_DIR:-meili_data}:/meili_data
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY}
      MEILI_ENV: production
    # not published to the host - reachable only inside the Docker network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══ Object storage ═══
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    volumes:
      - ${MINIO_DATA_DIR:-minio_data}:/data
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-sinout}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD}
    # not published to the host - reachable only inside the Docker network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══ Web search (SearXNG metasearch) ═══
  searxng:
    image: searxng/searxng:latest
    restart: unless-stopped
    volumes:
      # The settings file only, and read-only. Mounting the whole directory
      # writable let the container chown it (it has CHOWN), and after the very
      # first start git could no longer update settings.yml: "Permission denied"
      # on every deploy that touches this setting.
      - ./searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-sinout_searxng_secret_key_2024}
    # not published to the host - reachable only inside the Docker network
    cap_drop:
      - ALL
    cap_add:
      - SETGID
      - SETUID
      - DAC_OVERRIDE

  # ═══ Local transcription (faster-whisper, OpenAI-compatible API) ═══
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    restart: unless-stopped
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-base}
      WHISPER__INFERENCE_DEVICE: cpu
      WHISPER__COMPUTE_TYPE: int8
    # The only service here that used to run without a memory ceiling — and
    # without one the shortage hits a random neighbour (Postgres, say) rather
    # than this container. Measured on a one-minute voice note: base peaks at
    # 419 MB, small at 818 MB. A gigabyte covers both, so switching the model is
    # not a silent breakage. For medium (1.46 GB of weights) raise WHISPER_MEM
    # to 2g — a deliberate choice, and one that should not pass unnoticed.
    mem_limit: ${WHISPER_MEM:-1g}
    volumes:
      - whisper_models:/root/.cache/huggingface
    # not published to the host - reached internally at http://whisper:8000

  # ═══ Backend API ═══
  backend:
    build:
      context: ./packages/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3010
      DATABASE_URL: postgresql://${DB_USER:-sinout}:${DB_PASSWORD}@postgres:5432/sinout
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379
      MEILI_URL: http://meilisearch:7700
      MEILI_KEY: ${MEILI_KEY}
      MINIO_ENDPOINT: minio
      MINIO_PORT: "9000"
      MINIO_USER: ${MINIO_USER:-sinout}
      MINIO_PASSWORD: ${MINIO_PASSWORD}
      MINIO_USE_SSL: "false"
      # Where admin backups go (optional): a ';'-separated list of "Label=/abs/path".
      # Every path must also be mounted into the container (see volumes below).
      BACKUP_DIRS: ${BACKUP_DIRS:-}
      JWT_SECRET: ${JWT_SECRET}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3012}
      APP_URL: ${APP_URL:-}
      SEARXNG_URL: http://searxng:8080
      WHISPER_URL: http://whisper:8000/v1
      WHISPER_MODEL: ${WHISPER_MODEL:-Systran/faster-whisper-base}
      # Crypto billing (NOWPayments) — empty disables /billing/invoice (503)
      NOWPAYMENTS_API_KEY: ${NOWPAYMENTS_API_KEY:-}
      NOWPAYMENTS_IPN_SECRET: ${NOWPAYMENTS_IPN_SECRET:-}
      PRICE_PRO_USD: ${PRICE_PRO_USD:-39}
      PRICE_TEAM_USD: ${PRICE_TEAM_USD:-149}
      APP_VERSION: ${APP_VERSION:-dev}
      APP_BUILT_AT: ${APP_BUILT_AT:-}
      # Semantic memory - OPTIONAL server-side fallback (the operator then pays for
      # everyone without a key). The main path is BYOK: Settings -> AI -> Embeddings.
      EMBEDDINGS_API_KEY: ${EMBEDDINGS_API_KEY:-}
      EMBEDDINGS_BASE_URL: ${EMBEDDINGS_BASE_URL:-}
      EMBEDDINGS_MODEL: ${EMBEDDINGS_MODEL:-}
      # Custom skills: allow requests to internal/private addresses (blocked by default)
      ALLOW_CUSTOM_TOOL_INTERNAL: ${ALLOW_CUSTOM_TOOL_INTERNAL:-}
      # Code execution sandbox (a separate, isolated `executor` container)
      DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-self-hosted}
      # Edition: empty = regular multi-user/cloud; solo = personal self-hosted build.
      SINOUT_EDITION: ${SINOUT_EDITION:-solo}
      EXECUTOR_URL: ${EXECUTOR_URL:-http://executor:8088}
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
    # The backend sits on three networks and one of them (sandbox) is internal -
    # no internet. Docker picks ONE default gateway; when it picked sandbox, the
    # container lost outbound access entirely: Telegram, embeddings and payments
    # all stopped. DNS kept working (it is local), so the logs read "the name
    # resolved but the connection timed out" and the ISP looked guilty. Recreating
    # the container could re-pick the gateway - hence "it broke on its own". So we
    # pin the gateway to default.
    networks:
      default:
        gw_priority: 100
      sandbox: {}
      sandbox_net: {}
    # not published to the host - proxied through nginx
    volumes:
      - ${UPLOADS_DIR:-uploads}:/app/uploads
      # Optional dedicated disk for backups: set BACKUP_MOUNT=/abs/path in .env
      # (together with BACKUP_DIRS=Label=/backups). Otherwise ./backups is used.
      - ${BACKUP_MOUNT:-./backups}:/backups
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ═══ Code-execution sandbox ═══
  # Runs untrusted agent code (Python/bash) in isolation: no secrets, no DB,
  # on an `internal` network (no internet), resource-limited, read-only, non-root.
  executor:
    build:
      context: ./executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8088
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
    networks: [sandbox]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # Same sandbox but WITH internet — admin-only relaxation (still no DB/secrets;
  # on its own network, not the app network). Gated by capability code_exec:net.
  executor-net:
    build:
      context: ./executor
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8088
      EXECUTOR_TOKEN: ${EXECUTOR_TOKEN:-}
    networks: [sandbox_net]
    mem_limit: 256m
    cpus: 0.5
    pids_limit: 128
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true

  # ═══ Embeddings: our own service, no internet and no keys ═══
  # Part of the stack by default, because hosted options have all but run out:
  # OpenRouter no longer serves embeddings at all, and OpenAI is blocked outright
  # in a number of countries. A local service removes both problems - and keeps
  # the text from leaving the machine, which is the whole point of self-hosting.
  #
  # The default model is multilingual, 384 dimensions, ~0.5 GB on disk and
  # noticeably less in memory. Larger and more accurate: multilingual-e5-base or
  # BAAI/bge-m3 - both need more of each (see EMBEDDINGS_MEM).
  #
  # IMPORTANT: changing the model changes the vector dimension. Embeddings that
  # are already stored become incomparable with new ones and must be reindexed.
  #
  # The backend does NOT wait for it: the first model download takes minutes and
  # holding the whole stack for that is pointless - semantic search joins in once
  # the service is up.
  embeddings:
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-latest
    restart: unless-stopped
    command: ["--model-id", "${EMBEDDINGS_MODEL_ID:-intfloat/multilingual-e5-small}"]
    volumes:
      - embeddings_models:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 180s   # the first model download takes longer than a normal start
    mem_limit: ${EMBEDDINGS_MEM:-1g}
    cpus: 2.0
    security_opt:
      - no-new-privileges:true

  # ═══ MCP Server ═══
  mcp-server:
    build:
      context: ./packages/mcp-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3011
      BACKEND_URL: http://backend:3010
      MCP_API_KEY: ${MCP_API_KEY}
    # not published to the host - reachable only inside the Docker network

  # ═══ Collab Server (Yjs / Hocuspocus) ═══
  collab-server:
    build:
      context: ./packages/collab-server
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 3012
      DATABASE_URL: postgresql://${DB_USER:-sinout}:${DB_PASSWORD}@postgres:5432/sinout
      JWT_SECRET: ${JWT_SECRET}

  # ═══ Frontend ═══
  frontend:
    build:
      context: ./packages/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    # not published to the host - proxied through nginx

  # ═══ Reverse Proxy ═══
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8090:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ssl_certs:/etc/nginx/ssl
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started

networks:
  # Main app network (all services use it by default).
  default: {}
  # Sandbox: isolated, no internet (internal). Only the backend + executor join it.
  sandbox:
    internal: true
  # Admin sandbox: has internet (NOT internal), but separate from app services
  # (no DB/redis/minio). Only backend + executor-net join it.
  sandbox_net: {}

volumes:
  # Used by default (when *_DATA_DIR / UPLOADS_DIR are not set in .env).
  postgres_data:
  meili_data:
  minio_data:
  uploads:
  redis_data:
  ssl_certs:
  whisper_models:
  embeddings_models:
