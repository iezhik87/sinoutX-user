events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile        on;
  keepalive_timeout  65;
  client_max_body_size 50M;

  # Don't advertise the nginx version.
  server_tokens off;

  # Anti-abuse throttle for the public SearXNG proxy — generous enough for real
  # interactive search (typing + autocomplete) but caps someone using our
  # instance as a free search API. Per client IP.
  limit_req_zone $binary_remote_addr zone=search:10m rate=20r/s;

  # Gzip
  gzip on;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

  # Docker internal DNS — lazy resolution so nginx starts even if upstreams are temporarily down
  resolver 127.0.0.11 valid=10s ipv6=off;

  upstream backend {
    server backend:3010;
  }

  upstream frontend {
    server frontend:80;
  }

  server {
    listen 80;
    server_name _;

    # Security headers are set where the content is produced, to avoid duplicates
    # this proxy would otherwise stack on top: backend routes get them from helmet,
    # the SPA/HTML gets them from the frontend container's nginx. This block only
    # routes — it must not add its own security headers.

    # AI chat — SSE streaming, long timeout, no buffering
    location /api/v1/ai/chat {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 600s;
      proxy_send_timeout 600s;
      chunked_transfer_encoding on;
    }

    # API
    location /api/ {
      proxy_pass http://backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
    }

    # API Docs
    location /docs {
      proxy_pass http://backend;
      proxy_set_header Host $host;
    }

    # Health check
    location /health {
      proxy_pass http://backend;
    }

    # Collab server — Hocuspocus WebSocket (exact match so /collab-presence isn't captured)
    location = /collab {
      set $collab collab-server:3012;
      proxy_pass http://$collab;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_read_timeout 86400;
    }

    # Realtime updates WebSocket (Fastify /ws) — live page/task/canvas updates
    location = /ws {
      proxy_pass http://backend;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_read_timeout 86400;
    }

    # Collab presence API
    location /collab-presence {
      set $collabp collab-server:3013;
      proxy_pass http://$collabp/presence;
      proxy_set_header Host $host;
    }

    # MCP Server (lazy resolve via variable to not block nginx reload when mcp-server is down)
    # The MCP server only accepts POST /mcp (StreamableHTTP, stateless). Use an
    # EXACT match (= /mcp) so nginx never issues the trailing-slash 301 to /mcp/
    # (which also downgraded https→http). proxy_pass with a variable and no URI
    # part forwards $request_uri ("/mcp") unchanged.
    location = /mcp {
      set $mcp mcp-server:3011;
      proxy_pass http://$mcp;
      absolute_redirect off;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      # StreamableHTTP responses stream — don't buffer, keep the connection open.
      proxy_buffering off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    # SearXNG proxy — strips X-Frame-Options so it can be embedded
    location /search/ {
      limit_req zone=search burst=40 nodelay;
      set $searxng searxng:8080;
      proxy_pass http://$searxng/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_hide_header X-Frame-Options;
      proxy_hide_header Content-Security-Policy;
      add_header X-Frame-Options "SAMEORIGIN" always;
      proxy_http_version 1.1;
      sub_filter_once off;
      proxy_redirect http://$searxng/ /search/;
      proxy_redirect / /search/;
    }

    # Frontend (SPA)
    location / {
      proxy_pass http://frontend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
